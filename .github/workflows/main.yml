name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tenant_prochat_user:ci-pass@localhost:5433/postgres?schema=tenant_prochat
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres?schema=public
      SYSTEM_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres?schema=public
      APP_SLUG: prochat
      TENANT_DB_PASSWORD: ci-pass
      STRIPE_MODE: test
      NEXT_PUBLIC_STRIPE_MODE: test
      STRIPE_SECRET_KEY_TEST: sk_test_ci_dummy
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST: pk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET_TEST: whsec_ci_dummy
      STRIPE_PRICE_PROKIT_TEST: price_ci_prokit
      STRIPE_PRODUCT_PROKIT_TEST: prod_ci_prokit
      STRIPE_PRICE_SAASKIT_TEST: price_ci_saaskit
      STRIPE_PRODUCT_SAASKIT_TEST: prod_ci_saaskit
      RESEND_API_KEY: dummy-ci-key
      PROCHAT_MAINTENANCE_MODE: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision tenant schema
        run: npm run db:init -- --slug "$APP_SLUG"

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/system.prisma

      - name: Run migrations
        run: npm run db:migrate:dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint design-system governance
        run: npm run lint:design

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Start production server
        id: server
        run: |
          SERVER_LOG="${RUNNER_TEMP}/prochat-server.log"
          sh scripts/start-production.sh >"$SERVER_LOG" 2>&1 &
          WRAPPER_PID=$!
          echo "wrapper_pid=$WRAPPER_PID" >> "$GITHUB_OUTPUT"
          echo "server_log=$SERVER_LOG" >> "$GITHUB_OUTPUT"
        env:
          NODE_ENV: production
          HOSTNAME: 0.0.0.0
          PORT: 3000
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SYSTEM_DATABASE_URL: ${{ env.SYSTEM_DATABASE_URL }}
          SHADOW_DATABASE_URL: ${{ env.SHADOW_DATABASE_URL }}
          APP_SLUG: ${{ env.APP_SLUG }}
          TENANT_DB_PASSWORD: ${{ env.TENANT_DB_PASSWORD }}
          STRIPE_MODE: test
          NEXT_PUBLIC_STRIPE_MODE: test
          STRIPE_SECRET_KEY_TEST: sk_test_ci_dummy
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST: pk_test_ci_dummy
          STRIPE_WEBHOOK_SECRET_TEST: whsec_ci_dummy
          RESEND_API_KEY: dummy-ci-key
          PROCHAT_MAINTENANCE_MODE: '0'

      - name: Wait for server readiness
        run: |
          MAX_ATTEMPTS=30
          INTERVAL=2
          CONNECT_TIMEOUT=2
          REQUEST_TIMEOUT=5
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout "$CONNECT_TIMEOUT" \
              --max-time "$REQUEST_TIMEOUT" \
              http://localhost:3000/api/health || echo "000")
            echo "Attempt $i/$MAX_ATTEMPTS — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Server is ready."
              exit 0
            fi
            sleep $INTERVAL
          done
          echo "Server did not become ready after $((MAX_ATTEMPTS * INTERVAL))s."
          echo "--- server log tail ---"
          tail -n 50 "${{ steps.server.outputs.server_log }}" 2>/dev/null || true
          exit 1

      - name: Run browser evidence
        env:
          WAVE1_BASE_URL: http://localhost:3000
          CI: 'true'
        run: npm run test:evidence:ci

      - name: Stop production server
        if: always()
        run: |
          WRAPPER_PID="${{ steps.server.outputs.wrapper_pid }}"
          if [ -n "$WRAPPER_PID" ] && kill -0 "$WRAPPER_PID" 2>/dev/null; then
            # Terminate direct children of the wrapper shell first.
            pkill -TERM -P "$WRAPPER_PID" 2>/dev/null || true
            kill -TERM "$WRAPPER_PID" 2>/dev/null || true
            sleep 3
            # Escalate to SIGKILL if still running.
            pkill -KILL -P "$WRAPPER_PID" 2>/dev/null || true
            kill -KILL "$WRAPPER_PID" 2>/dev/null || true
          fi
          true

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            tests/evidence/test-results/
            ${{ steps.server.outputs.server_log }}
          if-no-files-found: ignore
          retention-days: 7

  docs-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Check environment docs
        run: node scripts/check-env-docs.js
      - name: Check doc links
        run: node scripts/check-doc-links.js
      - name: Validate docs pipeline
        run: npm run docs:validate

  detect-deployment-changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changed-paths.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changed-paths
        name: Detect deployment-relevant changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "No usable push base SHA; enabling deployment fail-safe."
            exit 0
          fi

          mapfile -t changed_paths < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          if [ "${#changed_paths[@]}" -eq 0 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "No changed paths detected; enabling deployment fail-safe."
            exit 0
          fi

          docs_only=true
          for path in "${changed_paths[@]}"; do
            case "$path" in
              docs/*|docs-public/*|README.md)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done

          if [ "$docs_only" = true ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change; deployment disabled."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Runtime or unclassified change detected; deployment enabled."
          fi

          printf '%s\n' "${changed_paths[@]}"

  build-and-deploy:
    needs: [ci, docs-integrity, detect-deployment-changes]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.detect-deployment-changes.outputs.deploy == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture release metadata
        id: release
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            PROCHAT_GIT_SHA=${{ github.sha }}
            PROCHAT_IMAGE_REF=ghcr.io/${{ github.repository }}:${{ github.sha }}
            PROCHAT_BUILD_TIMESTAMP=${{ steps.release.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy redeploy
        id: dokploy
        run: |
          DOKPLOY_URL="${{ secrets.DOKPLOY_URL || 'https://dokploy.prochat.tools' }}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 5 \
            --max-time 15 \
            -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ secrets.DOKPLOY_APP_ID }}\"}")

          echo "HTTP status: $RESPONSE"

          if [ "$RESPONSE" != "200" ]; then
            echo "Dokploy trigger failed with status $RESPONSE"
            exit 1
          fi

          echo "Deployment triggered successfully."

      - name: Verify production deployment
        timeout-minutes: 6
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # Bounds: 12 attempts × 10s interval + 3 requests × 5s max-time each = ~155s worst case per loop.
          # With no sleep after the final attempt: (12-1)×10 + 12×3×5 = 110 + 180 = 290s maximum.
          # The timeout-minutes: 6 step limit (360s) is the hard outer boundary.
          MAX_ATTEMPTS=12
          INTERVAL=10
          CONNECT_TIMEOUT=2
          REQUEST_TIMEOUT=5
          echo "Polling production for revision=$EXPECTED_SHA (max ${MAX_ATTEMPTS} attempts, ${INTERVAL}s interval)"

          for i in $(seq 1 $MAX_ATTEMPTS); do
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout "$CONNECT_TIMEOUT" \
              --max-time "$REQUEST_TIMEOUT" \
              https://prochat.tools/api/health || echo "000")

            VERSION_STATUS=$(curl -s -o /tmp/version_body.json -w "%{http_code}" \
              --connect-timeout "$CONNECT_TIMEOUT" \
              --max-time "$REQUEST_TIMEOUT" \
              https://prochat.tools/api/version 2>/dev/null || echo "000")
            OBSERVED_SHA=$(grep -o '"revision":"[^"]*"' /tmp/version_body.json 2>/dev/null | cut -d'"' -f4 || echo "")

            DOCS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout "$CONNECT_TIMEOUT" \
              --max-time "$REQUEST_TIMEOUT" \
              https://prochat.tools/docs || echo "000")

            echo "Attempt $i/$MAX_ATTEMPTS — health=$HEALTH_STATUS version=$VERSION_STATUS docs=$DOCS_STATUS revision=$OBSERVED_SHA expected=$EXPECTED_SHA"

            if [ "$HEALTH_STATUS" = "200" ] && [ "$VERSION_STATUS" = "200" ] && [ "$DOCS_STATUS" = "200" ] && [ "$OBSERVED_SHA" = "$EXPECTED_SHA" ]; then
              echo "Production verified: health OK, version OK, docs OK, revision matches."
              exit 0
            fi

            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              sleep $INTERVAL
            fi
          done

          echo "Production verification failed after $((MAX_ATTEMPTS * INTERVAL))s interval budget."
          echo "Expected revision: $EXPECTED_SHA"
          echo "Last observed revision: $OBSERVED_SHA"
          echo "Last health status: $HEALTH_STATUS"
          echo "Last version status: $VERSION_STATUS"
          echo "Last docs status: $DOCS_STATUS"
          exit 1
