name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tenant_prochat_user:ci-pass@localhost:5433/postgres?schema=tenant_prochat
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres?schema=public
      SYSTEM_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres?schema=public
      APP_SLUG: prochat
      TENANT_DB_PASSWORD: ci-pass
      STRIPE_MODE: test
      NEXT_PUBLIC_STRIPE_MODE: test
      STRIPE_SECRET_KEY_TEST: sk_test_ci_dummy
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST: pk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET_TEST: whsec_ci_dummy
      STRIPE_PRICE_PROKIT_TEST: price_ci_prokit
      STRIPE_PRODUCT_PROKIT_TEST: prod_ci_prokit
      STRIPE_PRICE_SAASKIT_TEST: price_ci_saaskit
      STRIPE_PRODUCT_SAASKIT_TEST: prod_ci_saaskit
      RESEND_API_KEY: dummy-ci-key

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision tenant schema
        run: npm run db:init -- --slug "$APP_SLUG"

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/system.prisma

      - name: Run migrations
        run: npm run db:migrate:dev

      - name: Lint design-system governance
        run: npm run lint:design

      - name: Build
        run: npm run build

  docs-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Check environment docs
        run: node scripts/check-env-docs.js
      - name: Check doc links
        run: node scripts/check-doc-links.js
      - name: Validate docs pipeline
        run: npm run docs:validate

  detect-deployment-changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changed-paths.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changed-paths
        name: Detect deployment-relevant changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "No usable push base SHA; enabling deployment fail-safe."
            exit 0
          fi

          mapfile -t changed_paths < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          if [ "${#changed_paths[@]}" -eq 0 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "No changed paths detected; enabling deployment fail-safe."
            exit 0
          fi

          docs_only=true
          for path in "${changed_paths[@]}"; do
            case "$path" in
              docs/*|docs-public/*|README.md)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done

          if [ "$docs_only" = true ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change; deployment disabled."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Runtime or unclassified change detected; deployment enabled."
          fi

          printf '%s\n' "${changed_paths[@]}"

  build-and-deploy:
    needs: [ci, docs-integrity, detect-deployment-changes]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.detect-deployment-changes.outputs.deploy == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture release metadata
        id: release
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            PROCHAT_GIT_SHA=${{ github.sha }}
            PROCHAT_IMAGE_REF=ghcr.io/${{ github.repository }}:${{ github.sha }}
            PROCHAT_BUILD_TIMESTAMP=${{ steps.release.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy redeploy
        run: |
          DOKPLOY_URL="${{ secrets.DOKPLOY_URL || 'https://dokploy.prochat.tools' }}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ secrets.DOKPLOY_APP_ID }}\"}")

          echo "HTTP status: $RESPONSE"

          if [ "$RESPONSE" != "200" ]; then
            echo "Dokploy trigger failed with status $RESPONSE"
            exit 1
          fi

          echo "Deployment triggered successfully."
