name: Docs Sync

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Product identifier (prokit, saaskit, waaskit, future)'
        required: true
      docsPath:
        description: 'Path to exported documentation'
        required: false
        default: docs-export
      commit:
        description: 'Source commit SHA'
        required: false
  repository_dispatch:
    types: [docs-sync]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache docs artifacts
        uses: actions/cache@v3
        with:
          path: .cache/docs
          key: docs-cache-${{ github.sha }}
          restore-keys: |
            docs-cache-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Ingest external docs
        env:
          DOCS_EXPORT_PRODUCT: ${{ github.event.inputs.product || github.event.client_payload.product }}
          DOCS_EXPORT_PATH: ${{ github.event.inputs.docsPath || github.event.client_payload.docsPath || 'docs-export' }}
          DOCS_EXPORT_COMMIT: ${{ github.event.inputs.commit || github.event.client_payload.commit || '' }}
        run: npm run docs:ingest
      - name: Generate and validate docs
        env:
          DOCS_STRICT: 'true'
          DOCS_SOURCE_COMMIT: ${{ github.event.inputs.commit || github.event.client_payload.commit || '' }}
        run: npm run docs:ai-build
