name: Docs Pipeline

on:
  push:
    paths:
      - 'docs-ingest/**'
      - 'scripts/docs/**'
      - 'src/content/docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run docs:ai-build
        env:
          DOCS_STRICT: 'true'
