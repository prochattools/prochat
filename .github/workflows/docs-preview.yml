name: Docs Preview

on:
  pull_request:
    paths:
      - 'docs-ingest/**'
      - 'scripts/docs/**'
      - 'src/content/docs/**'

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache docs artifacts
        uses: actions/cache@v3
        with:
          path: .cache/docs
          key: docs-cache-${{ github.sha }}
          restore-keys: |
            docs-cache-
      - name: Install dependencies
        run: npm install
      - name: Run docs pipeline
        env:
          DOCS_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          DOCS_STRICT: 'true'
        run: npm run docs:ai-build
      - name: Build Next.js preview
        run: npm run build
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: .next
