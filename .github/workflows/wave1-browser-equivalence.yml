name: Wave 1 Browser Equivalence

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline commit
        required: true
        default: b3739ba327b8601fe1962a522cb83e59f444d40e
      target_ref:
        description: Target commit
        required: true
        default: 4d12c0560b3265585d5d7702eb539a67bda91917
      retain_days:
        description: Artifact retention days
        required: true
        default: '14'

env:
  NODE_VERSION: '20'
  PLAYWRIGHT_VERSION: '1.55.0'
  BASELINE_PORT: '3101'
  TARGET_PORT: '3102'
  PROCHAT_MAINTENANCE_MODE: '0'
  NODE_ENV: test
  SYSTEM_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres?schema=public
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres?schema=public
  STRIPE_MODE: test
  NEXT_PUBLIC_STRIPE_MODE: test
  STRIPE_SECRET_KEY_TEST: sk_test_ci_dummy
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST: pk_test_ci_dummy
  STRIPE_WEBHOOK_SECRET_TEST: whsec_ci_dummy
  STRIPE_PRICE_PROKIT_TEST: price_ci_prokit
  STRIPE_PRODUCT_PROKIT_TEST: prod_ci_prokit
  STRIPE_PRICE_SAASKIT_TEST: price_ci_saaskit
  STRIPE_PRODUCT_SAASKIT_TEST: prod_ci_saaskit
  RESEND_API_KEY: re_ci_dummy
  WAVE1_BASELINE_REF: ${{ inputs.baseline_ref }}
  WAVE1_TARGET_REF: ${{ inputs.target_ref }}

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: wave1-browser-verification

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout verification harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout baseline
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout target
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.target_ref }}
          path: target
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            baseline/package-lock.json
            target/package-lock.json

      - name: Verify immutable provenance
        id: provenance
        env:
          EXPECTED_BASELINE_SHA: ${{ inputs.baseline_ref }}
          EXPECTED_TARGET_SHA: ${{ inputs.target_ref }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          node <<'EOF'
          const { execSync } = require('node:child_process')
          const fs = require('node:fs')

          const shaRe = /^[0-9a-f]{40}$/
          const expectedBaseline = process.env.EXPECTED_BASELINE_SHA || ''
          const expectedTarget = process.env.EXPECTED_TARGET_SHA || ''

          if (!shaRe.test(expectedBaseline)) {
            throw new Error(`baseline_ref must be a full 40-character SHA: ${expectedBaseline}`)
          }

          if (!shaRe.test(expectedTarget)) {
            throw new Error(`target_ref must be a full 40-character SHA: ${expectedTarget}`)
          }

          const baselineSha = execSync('git -C baseline rev-parse HEAD', { encoding: 'utf8' }).trim()
          const targetSha = execSync('git -C target rev-parse HEAD', { encoding: 'utf8' }).trim()
          const harnessSha = execSync('git -C harness rev-parse HEAD', { encoding: 'utf8' }).trim()

          if (baselineSha !== expectedBaseline) {
            throw new Error(`baseline checkout SHA mismatch: ${baselineSha} !== ${expectedBaseline}`)
          }

          if (targetSha !== expectedTarget) {
            throw new Error(`target checkout SHA mismatch: ${targetSha} !== ${expectedTarget}`)
          }

          const provenance = {
            baselineSha,
            targetSha,
            harnessSha,
            nodeVersion: process.version.replace(/^v/, ''),
            npmVersion: execSync('npm --version', { encoding: 'utf8' }).trim(),
            workflowName: process.env.WORKFLOW_NAME,
            workflowRunId: process.env.WORKFLOW_RUN_ID,
            workflowRunAttempt: process.env.WORKFLOW_RUN_ATTEMPT,
            workflowSha: process.env.WORKFLOW_SHA,
            runnerOs: process.env.RUNNER_OS,
            runnerArch: process.env.RUNNER_ARCH,
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `baseline_sha=${baselineSha}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `target_sha=${targetSha}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `harness_sha=${harnessSha}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `node_version=${provenance.nodeVersion}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `npm_version=${provenance.npmVersion}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `workflow_name=${provenance.workflowName}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `workflow_run_id=${provenance.workflowRunId}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `workflow_run_attempt=${provenance.workflowRunAttempt}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `workflow_sha=${provenance.workflowSha}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `runner_os=${provenance.runnerOs}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `runner_arch=${provenance.runnerArch}\n`)

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n## Provenance\n\n- Baseline SHA: \`${baselineSha}\`\n- Target SHA: \`${targetSha}\`\n- Harness SHA: \`${harnessSha}\`\n- Node: \`${provenance.nodeVersion}\`\n- npm: \`${provenance.npmVersion}\`\n- Workflow: \`${provenance.workflowName}\` #\`${provenance.workflowRunAttempt}\`\n- Workflow run ID: \`${provenance.workflowRunId}\`\n- Workflow SHA: \`${provenance.workflowSha}\`\n- Runner OS: \`${provenance.runnerOs}\` (\`${provenance.runnerArch}\`)\n`)
          EOF

      - name: Install baseline dependencies
        working-directory: baseline
        run: npm ci

      - name: Install target dependencies
        working-directory: target
        run: npm ci

      - name: Install transient Playwright runner
        working-directory: harness
        run: |
          npm install --no-save --package-lock=false "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Capture browser runtime identity
        id: browser-runtime
        working-directory: harness
        run: |
          node <<'EOF'
          const { execSync } = require('node:child_process')
          const fs = require('node:fs')

          const playwrightVersion = execSync('npx playwright --version', { encoding: 'utf8' }).trim()
          const chromiumExecutablePath = execSync(
            'node -e "const { chromium } = require(\'@playwright/test\'); process.stdout.write(chromium.executablePath())"',
            { encoding: 'utf8' },
          ).trim()
          const chromiumVersion = execSync(`"${chromiumExecutablePath}" --version`, {
            encoding: 'utf8',
          }).trim()

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `playwright_version=${playwrightVersion}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `chromium_version=${chromiumVersion}\n`)
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n## Browser toolchain\n\n- Playwright: \`${playwrightVersion}\`\n- Chromium: recorded in per-route browser payloads via \`browser.version()\`\n`)
          EOF

      - name: Provision and build baseline
        working-directory: baseline
        env:
          APP_SLUG: prochat_wave1_baseline
          TENANT_DB_PASSWORD: ci-pass
          DATABASE_URL: postgresql://tenant_prochat_wave1_baseline_user:ci-pass@localhost:5433/postgres?schema=tenant_prochat_wave1_baseline
        run: |
          npm run db:init -- --slug "$APP_SLUG"
          npx prisma generate --schema=prisma/system.prisma
          npm run db:migrate:prod
          npm run build

      - name: Provision and build target
        working-directory: target
        env:
          APP_SLUG: prochat_wave1_target
          TENANT_DB_PASSWORD: ci-pass
          DATABASE_URL: postgresql://tenant_prochat_wave1_target_user:ci-pass@localhost:5433/postgres?schema=tenant_prochat_wave1_target
        run: |
          npm run db:init -- --slug "$APP_SLUG"
          npx prisma generate --schema=prisma/system.prisma
          npm run db:migrate:prod
          npm run build

      - name: Start baseline and target
        env:
          BASELINE_DATABASE_URL: postgresql://tenant_prochat_wave1_baseline_user:ci-pass@localhost:5433/postgres?schema=tenant_prochat_wave1_baseline
          TARGET_DATABASE_URL: postgresql://tenant_prochat_wave1_target_user:ci-pass@localhost:5433/postgres?schema=tenant_prochat_wave1_target
        run: |
          (
            cd baseline
            PORT="$BASELINE_PORT" DATABASE_URL="$BASELINE_DATABASE_URL" PROCHAT_MAINTENANCE_MODE=0 \
              ./node_modules/.bin/next start -p "$BASELINE_PORT" > /dev/null 2>&1
          ) &
          echo $! > "$RUNNER_TEMP/baseline.pid"
          (
            cd target
            PORT="$TARGET_PORT" DATABASE_URL="$TARGET_DATABASE_URL" PROCHAT_MAINTENANCE_MODE=0 \
              ./node_modules/.bin/next start -p "$TARGET_PORT" > /dev/null 2>&1
          ) &
          echo $! > "$RUNNER_TEMP/target.pid"
          for attempt in $(seq 1 60); do
            curl --fail --silent "http://127.0.0.1:${BASELINE_PORT}/api/health" >/dev/null && \
            curl --fail --silent "http://127.0.0.1:${TARGET_PORT}/api/health" >/dev/null && exit 0
            sleep 2
          done
          echo "Wave 1 browser runner failed to reach both health endpoints in time."
          exit 1

      - name: Capture baseline snapshots
        working-directory: harness
        env:
          WAVE1_BASE_URL: http://127.0.0.1:3101
          WAVE1_RUN_LABEL: baseline-${{ steps.provenance.outputs.baseline_sha }}
          WAVE1_BASELINE_SHA: ${{ steps.provenance.outputs.baseline_sha }}
          WAVE1_TARGET_SHA: ${{ steps.provenance.outputs.target_sha }}
          WAVE1_HARNESS_SHA: ${{ steps.provenance.outputs.harness_sha }}
        run: |
          npx playwright test tests/evidence/wave1-shell-equivalence.spec.ts \
            --config=tests/evidence/playwright.wave1.config.ts \
            --update-snapshots \
            --reporter=line,html \
            --trace=retain-on-failure

      - name: Compare target against baseline
        working-directory: harness
        env:
          WAVE1_BASE_URL: http://127.0.0.1:3102
          WAVE1_RUN_LABEL: target-${{ steps.provenance.outputs.target_sha }}
          WAVE1_BASELINE_SHA: ${{ steps.provenance.outputs.baseline_sha }}
          WAVE1_TARGET_SHA: ${{ steps.provenance.outputs.target_sha }}
          WAVE1_HARNESS_SHA: ${{ steps.provenance.outputs.harness_sha }}
        run: |
          npx playwright test tests/evidence/wave1-shell-equivalence.spec.ts \
            --config=tests/evidence/playwright.wave1.config.ts \
            --project=wave1-chromium \
            --reporter=line,html \
            --trace=retain-on-failure

      - name: Cleanup runner evidence
        if: always()
        run: |
          for pidfile in "$RUNNER_TEMP/baseline.pid" "$RUNNER_TEMP/target.pid"; do
            if [ -f "$pidfile" ]; then
              pid="$(cat "$pidfile")"
              kill "$pid" 2>/dev/null || true
            fi
            rm -f "$pidfile"
          done

      - name: Upload browser-equivalence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wave1-browser-equivalence-${{ steps.provenance.outputs.baseline_sha }}-${{ steps.provenance.outputs.target_sha }}
          retention-days: ${{ fromJSON(inputs.retain_days) }}
          if-no-files-found: warn
          path: |
            harness/playwright-report/**
            harness/test-results/**
            harness/tests/evidence/**/*-snapshots/**

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "# Wave 1 browser equivalence"
            echo
            echo "- Baseline SHA: \`${{ steps.provenance.outputs.baseline_sha }}\`"
            echo "- Target SHA: \`${{ steps.provenance.outputs.target_sha }}\`"
            echo "- Harness SHA: \`${{ steps.provenance.outputs.harness_sha }}\`"
            echo "- Commit provenance: validated resolved checkout SHAs and checked-out directories"
            echo "- Maintenance disabled: yes"
            echo "- Protected session strategy: public and unauthenticated only"
            echo "- Screenshot policy: provisional, retain-on-failure traces, no arbitrary masks"
            echo "- Browser: Chromium via transient Playwright ${PLAYWRIGHT_VERSION}"
            echo "- Repository package files changed: no"
            echo "- Canonical visual allowlist expected: empty"
            echo "- Evidence artifact: \`wave1-browser-equivalence-${{ steps.provenance.outputs.baseline_sha }}-${{ steps.provenance.outputs.target_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
