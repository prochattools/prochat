name: Docs Integrity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Check environment docs
        run: node scripts/check-env-docs.js
      - name: Check doc links
        run: node scripts/check-doc-links.js
      - name: Validate docs pipeline
        run: npm run docs:validate
