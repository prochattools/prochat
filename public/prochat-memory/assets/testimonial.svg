<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560">

  <!-- spoke lines — center box to satellite nodes -->
  <line x1="186" y1="238" x2="100" y2="158" stroke="#d3cbb8" stroke-width="2"/>
  <line x1="280" y1="202" x2="280" y2="122" stroke="#d3cbb8" stroke-width="2"/>
  <line x1="374" y1="238" x2="460" y2="158" stroke="#d3cbb8" stroke-width="2"/>
  <line x1="186" y1="322" x2="100" y2="402" stroke="#d3cbb8" stroke-width="2"/>
  <line x1="374" y1="322" x2="460" y2="402" stroke="#d3cbb8" stroke-width="2"/>

  <!-- center memory node -->
  <rect x="165" y="202" width="230" height="156" rx="10" fill="#15140f"/>
  <text x="280" y="254" font-family="'Inter Tight',sans-serif" font-size="17" font-weight="700" letter-spacing="0.12em" fill="#8b8676" text-anchor="middle">MEMORY</text>
  <text x="280" y="282" font-family="'JetBrains Mono',monospace" font-size="13" fill="#ed6f5c" text-anchor="middle">~/.brain/memory/</text>
  <text x="280" y="342" font-family="'Inter Tight',sans-serif" font-size="14" fill="#5a5448" text-anchor="middle">Shared · Reviewed</text>

  <!-- top-left: Developer — x=10 to 170, gap of 20 before QA -->
  <rect x="10" y="78" width="160" height="78" rx="7" fill="#f7f1de" stroke="#c8bfa8" stroke-width="1.5"/>
  <text x="90" y="113" font-family="'Inter Tight',sans-serif" font-size="18" font-weight="700" fill="#15140f" text-anchor="middle">Developer</text>
  <text x="90" y="139" font-family="'Inter Tight',sans-serif" font-size="14" fill="#8b8676" text-anchor="middle">Claude · Codex</text>

  <!-- top-center: QA Engineer (coral) — x=190 to 370, 20px gap each side -->
  <rect x="200" y="22" width="160" height="78" rx="7" fill="#ed6f5c"/>
  <text x="280" y="57" font-family="'Inter Tight',sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">QA Engineer</text>
  <text x="280" y="83" font-family="'Inter Tight',sans-serif" font-size="14" fill="rgba(255,255,255,0.8)" text-anchor="middle">Review · Validate</text>

  <!-- top-right: Tech writer — x=390 to 550, 20px gap after QA -->
  <rect x="390" y="78" width="160" height="78" rx="7" fill="#f7f1de" stroke="#c8bfa8" stroke-width="1.5"/>
  <text x="470" y="113" font-family="'Inter Tight',sans-serif" font-size="18" font-weight="700" fill="#15140f" text-anchor="middle">Tech writer</text>
  <text x="470" y="139" font-family="'Inter Tight',sans-serif" font-size="14" fill="#8b8676" text-anchor="middle">Document · Curate</text>

  <!-- bottom-left: Designer (olive) — x=10 to 170 -->
  <rect x="10" y="404" width="160" height="78" rx="7" fill="#6e7448"/>
  <text x="90" y="439" font-family="'Inter Tight',sans-serif" font-size="18" font-weight="700" fill="#efe7d2" text-anchor="middle">Designer</text>
  <text x="90" y="465" font-family="'Inter Tight',sans-serif" font-size="14" fill="rgba(239,231,210,0.8)" text-anchor="middle">Pattern · Decide</text>

  <!-- bottom-right: Team lead — x=390 to 550 -->
  <rect x="390" y="404" width="160" height="78" rx="7" fill="#f7f1de" stroke="#c8bfa8" stroke-width="1.5"/>
  <text x="470" y="439" font-family="'Inter Tight',sans-serif" font-size="18" font-weight="700" fill="#15140f" text-anchor="middle">Team lead</text>
  <text x="470" y="465" font-family="'Inter Tight',sans-serif" font-size="14" fill="#8b8676" text-anchor="middle">Approve · Share</text>

  <!-- foot annotation -->
  <line x1="60" y1="524" x2="500" y2="524" stroke="#d3cbb8" stroke-width="0.75"/>
  <text x="280" y="546" font-family="'Inter Tight',sans-serif" font-size="13" letter-spacing="0.14em" fill="#8b8676" text-anchor="middle">ONE MEMORY · MANY CONTRIBUTORS</text>
</svg>
