<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">

  <!-- proposed lesson card — 4px margins -->
  <rect x="4" y="4" width="392" height="392" rx="6" fill="#f7f1de" stroke="#15140f" stroke-width="1"/>

  <!-- card header -->
  <rect x="4" y="4" width="392" height="56" rx="6" fill="#15140f"/>
  <rect x="4" y="32" width="392" height="28" fill="#15140f"/>
  <text x="24" y="38" font-family="'Inter Tight',sans-serif" font-size="13" font-weight="700" letter-spacing="0.12em" fill="#8b8676">PROPOSED LESSON</text>
  <text x="380" y="38" font-family="'JetBrains Mono',monospace" font-size="11" fill="#ed6f5c" text-anchor="end">AI</text>

  <!-- metadata -->
  <text x="24" y="90" font-family="'JetBrains Mono',monospace" font-size="12" fill="#8b8676">type:</text>
  <text x="116" y="90" font-family="'JetBrains Mono',monospace" font-size="12" fill="#15140f">correction</text>
  <text x="24" y="114" font-family="'JetBrains Mono',monospace" font-size="12" fill="#8b8676">scope:</text>
  <text x="116" y="114" font-family="'JetBrains Mono',monospace" font-size="12" fill="#15140f">api.response</text>

  <line x1="24" y1="132" x2="376" y2="132" stroke="#e2d9c4" stroke-width="0.75"/>

  <!-- lesson rule large -->
  <text x="24" y="174" font-family="'Inter Tight',sans-serif" font-size="28" font-weight="700" fill="#15140f">Return empty array,</text>
  <text x="24" y="210" font-family="'Inter Tight',sans-serif" font-size="28" font-weight="700" fill="#15140f">never null.</text>

  <!-- action buttons -->
  <line x1="24" y1="238" x2="376" y2="238" stroke="#e2d9c4" stroke-width="0.75"/>

  <rect x="24" y="252" width="104" height="42" rx="5" fill="#ed6f5c"/>
  <text x="76" y="278" font-family="'Inter Tight',sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Approve</text>

  <rect x="138" y="252" width="76" height="42" rx="5" fill="#f7f1de" stroke="#c8bfa8" stroke-width="1"/>
  <text x="176" y="278" font-family="'Inter Tight',sans-serif" font-size="15" fill="#5a5448" text-anchor="middle">Edit</text>

  <rect x="224" y="252" width="76" height="42" rx="5" fill="#f7f1de" stroke="#c8bfa8" stroke-width="1"/>
  <text x="262" y="278" font-family="'Inter Tight',sans-serif" font-size="15" fill="#5a5448" text-anchor="middle">Reject</text>

  <rect x="310" y="252" width="76" height="42" rx="5" fill="#f7f1de" stroke="#c8bfa8" stroke-width="1"/>
  <text x="348" y="272" font-family="'Inter Tight',sans-serif" font-size="11" fill="#5a5448" text-anchor="middle">Keep</text>
  <text x="348" y="288" font-family="'Inter Tight',sans-serif" font-size="11" fill="#5a5448" text-anchor="middle">draft</text>

  <!-- approved state -->
  <line x1="24" y1="310" x2="376" y2="310" stroke="#e2d9c4" stroke-width="0.75"/>
  <rect x="24" y="324" width="118" height="40" rx="5" fill="#ed6f5c" opacity="0.12"/>
  <text x="83" y="349" font-family="'Inter Tight',sans-serif" font-size="14" font-weight="700" fill="#ed6f5c" text-anchor="middle">TRUSTED</text>
  <text x="196" y="344" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8b8676" text-anchor="middle">After approval</text>

  <text x="200" y="385" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="0.08em" fill="#8b8676" text-anchor="middle" opacity="0.45">DISCOVER</text>

</svg>
