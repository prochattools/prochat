<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">

  <!-- scan frame — 4px margins (96% fill each axis) -->
  <rect x="4" y="4" width="392" height="360" rx="4" fill="#f7f1de" stroke="#c8bfa8" stroke-width="1.5"/>

  <!-- scanning beam (coral) -->
  <rect x="4" y="180" width="392" height="6" fill="#ed6f5c" opacity="0.9"/>
  <rect x="4" y="155" width="392" height="30" fill="#ed6f5c" opacity="0.04"/>

  <!-- scanned rows above beam -->
  <rect x="22" y="22" width="252" height="13" rx="2" fill="#d3cbb8"/>
  <rect x="22" y="43" width="322" height="13" rx="2" fill="#d3cbb8"/>
  <rect x="22" y="64" width="220" height="13" rx="2" fill="#d3cbb8"/>
  <rect x="22" y="85" width="294" height="13" rx="2" fill="#e9b94a" opacity="0.65"/>
  <rect x="22" y="106" width="205" height="13" rx="2" fill="#d3cbb8"/>
  <rect x="22" y="127" width="278" height="13" rx="2" fill="#d3cbb8"/>
  <rect x="22" y="148" width="220" height="13" rx="2" fill="#d3cbb8"/>

  <!-- candidate highlight outline -->
  <rect x="12" y="76" width="356" height="38" rx="3" fill="#ed6f5c" opacity="0.07" stroke="#ed6f5c" stroke-width="0.75" stroke-dasharray="3,2"/>

  <!-- pending rows below beam (faint) -->
  <rect x="22" y="200" width="252" height="13" rx="2" fill="#d3cbb8" opacity="0.3"/>
  <rect x="22" y="221" width="324" height="13" rx="2" fill="#d3cbb8" opacity="0.3"/>
  <rect x="22" y="242" width="180" height="13" rx="2" fill="#d3cbb8" opacity="0.3"/>
  <rect x="22" y="263" width="284" height="13" rx="2" fill="#d3cbb8" opacity="0.3"/>
  <rect x="22" y="284" width="212" height="13" rx="2" fill="#d3cbb8" opacity="0.3"/>
  <rect x="22" y="305" width="128" height="13" rx="2" fill="#d3cbb8" opacity="0.3"/>

  <!-- status area inside frame -->
  <line x1="12" y1="334" x2="388" y2="334" stroke="#d3cbb8" stroke-width="0.75"/>
  <text x="200" y="355" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="0.1em" fill="#8b8676" text-anchor="middle">CANDIDATE FOUND</text>

  <!-- corner target marks (coral) -->
  <line x1="4" y1="7" x2="32" y2="7" stroke="#ed6f5c" stroke-width="2.5"/>
  <line x1="4" y1="7" x2="4" y2="35" stroke="#ed6f5c" stroke-width="2.5"/>
  <line x1="396" y1="7" x2="368" y2="7" stroke="#ed6f5c" stroke-width="2.5"/>
  <line x1="396" y1="7" x2="396" y2="35" stroke="#ed6f5c" stroke-width="2.5"/>
  <line x1="4" y1="363" x2="32" y2="363" stroke="#ed6f5c" stroke-width="2.5"/>
  <line x1="4" y1="363" x2="4" y2="335" stroke="#ed6f5c" stroke-width="2.5"/>
  <line x1="396" y1="363" x2="368" y2="363" stroke="#ed6f5c" stroke-width="2.5"/>
  <line x1="396" y1="363" x2="396" y2="335" stroke="#ed6f5c" stroke-width="2.5"/>

  <!-- ghost label -->
  <text x="200" y="390" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="0.08em" fill="#8b8676" text-anchor="middle" opacity="0.45">DETECT</text>

</svg>
