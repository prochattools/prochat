<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- no background rect — container (.bone) background shows through -->

  <!-- header bar — full width -->
  <rect width="400" height="80" fill="#15140f"/>
  <text x="22" y="32" font-family="'JetBrains Mono',Menlo,monospace" font-size="13" fill="#8b8676">decisions/</text>
  <text x="22" y="62" font-family="'JetBrains Mono',Menlo,monospace" font-size="16" font-weight="500" fill="#efe7d2">api-conventions.md</text>

  <!-- trusted badge mustard -->
  <rect x="292" y="16" width="84" height="28" rx="4" fill="#e9b94a" opacity="0.22"/>
  <text x="334" y="35" font-family="'Inter Tight',sans-serif" font-size="12" font-weight="700" fill="#c9950a" text-anchor="middle" letter-spacing="0.07em">TRUSTED</text>

  <!-- mustard left accent bar -->
  <rect x="0" y="80" width="7" height="420" fill="#e9b94a"/>

  <!-- metadata fields -->
  <text x="26" y="126" font-family="'JetBrains Mono',monospace" font-size="13" fill="#8b8676">type:</text>
  <text x="130" y="126" font-family="'JetBrains Mono',monospace" font-size="13" fill="#15140f">decision</text>

  <text x="26" y="156" font-family="'JetBrains Mono',monospace" font-size="13" fill="#8b8676">scope:</text>
  <text x="130" y="156" font-family="'JetBrains Mono',monospace" font-size="13" fill="#15140f">rest.versioning</text>

  <text x="26" y="186" font-family="'JetBrains Mono',monospace" font-size="13" fill="#8b8676">status:</text>
  <text x="130" y="186" font-family="'JetBrains Mono',monospace" font-size="13" fill="#c9950a">trusted</text>

  <text x="26" y="216" font-family="'JetBrains Mono',monospace" font-size="13" fill="#8b8676">source:</text>
  <text x="130" y="216" font-family="'JetBrains Mono',monospace" font-size="13" fill="#15140f">api-design-review</text>

  <!-- divider -->
  <line x1="26" y1="240" x2="378" y2="240" stroke="#d3cbb8" stroke-width="0.75"/>

  <!-- rule body -->
  <text x="26" y="288" font-family="'Inter Tight',sans-serif" font-size="24" font-weight="700" fill="#15140f">Always version</text>
  <text x="26" y="320" font-family="'Inter Tight',sans-serif" font-size="24" font-weight="700" fill="#15140f">endpoints.</text>

  <text x="26" y="366" font-family="'Inter',sans-serif" font-size="16" fill="#5a5448">Never modify a</text>
  <text x="26" y="388" font-family="'Inter',sans-serif" font-size="16" fill="#5a5448">published contract.</text>

  <!-- footer -->
  <line x1="26" y1="430" x2="378" y2="430" stroke="#d3cbb8" stroke-width="0.75"/>
  <text x="26" y="458" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8b8676">rest.versioning</text>
  <text x="378" y="458" font-family="'JetBrains Mono',monospace" font-size="12" fill="#c9950a" text-anchor="end">✓</text>
  <text x="26" y="480" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8b8676" letter-spacing="0.05em">api-design-review</text>
</svg>
